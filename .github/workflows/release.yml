name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

# Pin the IANA time-zone database so any temporal-sensitive Go time
# behaviour in this job is deterministic regardless of the runner's
# system tzdata build (slim vs fat). Go's time package reads ZONEINFO
# before the system database. This pin is retained as a defensive
# default; the temporal openCypher TCK scenarios themselves (e.g. the
# pre-1879 Europe/Stockholm offset in Temporal2.feature) are exercised
# by the local `make release-preflight` gate before the tag is pushed,
# not by this job. See cypher/tck/testdata/README.md.
env:
  ZONEINFO: ${{ github.workspace }}/cypher/tck/testdata/zoneinfo-slim.zip

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    # The job runs the fast Phase-A release-accuracy checks and THEN goreleaser
    # cross-compiles four platforms with SBOM generation. The heavy
    # correctness/coverage/TCK gates are not part of this job — they are
    # enforced LOCALLY by `make release-preflight` before the tag is pushed —
    # so 45m is now a generous ceiling dominated by the goreleaser build.
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
          cache: true
      # Release gate (Phase A only): verify the release paperwork is internally
      # consistent for this tag — CHANGELOG ## [x.y.z], release-notes/VERSION.md,
      # README current-release, SECURITY.md version table, docs/benchmarks/VERSION.md.
      #
      # Correctness (vet/build/`go test -race ./...`/golangci-lint), the coverage
      # gate, the full TCK execution and the crash-injection battery are NOT run
      # by this job. They are enforced LOCALLY by the `make release-preflight`
      # gate (release-accuracy + `make ci` + headline bench) which the releaser
      # runs before pushing the tag. `make ci` runs the correctness+coverage
      # suite exactly once (vet/build/test-short[-race]/lint/cover-gate; the TCK
      # =100% baseline runs inside the -race and coverage passes). This job
      # therefore only checks release accuracy, then publishes via goreleaser.
      - name: "Release-accuracy gate (Phase A: release-doc consistency)"
        run: VERSION="${GITHUB_REF_NAME}" make release-accuracy
      - name: Install cyclonedx-gomod (SBOM generator)
        run: |
          # Pinned to an exact released version so the SBOM generator in the
          # release path cannot be silently swapped by a moved/poisoned
          # upstream release (CWE-494). Bump this pin manually in lockstep
          # with the GitHub Actions SHA pins. cyclonedx-gomod is invoked by goreleaser
          # through the `before:` hook in .goreleaser.yaml; the version printed
          # below must equal the pin.
          go install github.com/CycloneDX/cyclonedx-gomod/cmd/cyclonedx-gomod@v1.10.0
          cyclonedx-gomod version
      - name: Run goreleaser
        uses: goreleaser/goreleaser-action@5daf1e915a5f0af01ddbcd89a43b8061ff4f1a89 # v7.2.2
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GOVERSION: "1.26"
